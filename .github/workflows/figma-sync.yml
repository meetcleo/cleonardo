name: figma-sync

# Second half of the Figma → cleonardo pipeline (COREEXP-323).
#
# The Cleo Token Sync Figma plugin pushes raw Variable exports to a throwaway
# `figma-sync/raw-<n>` branch under `.figma-sync/`. This workflow runs the transform
# against `main` and opens a review PR containing only the committed token files.
#
# The raw exports are copied into `packages/tokens/figma-exports/`, which is gitignored,
# so they can never reach the PR — only `packages/tokens/tokens/color/**` does.

on:
  push:
    branches:
      - 'figma-sync/raw-*'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  transform:
    runs-on: ubuntu-latest
    env:
      RAW_BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18.18.0'

      - name: Copy the raw export into the gitignored input directory
        run: |
          set -euo pipefail
          git fetch origin "$RAW_BRANCH"
          mkdir -p packages/tokens/figma-exports
          for file in primitives.json semantic.json index.json; do
            git show "origin/$RAW_BRANCH:.figma-sync/$file" > "packages/tokens/figma-exports/$file"
          done

      - name: Run the transform
        id: transform
        run: |
          set -euo pipefail
          # transform.mjs logs the change report and every failure to stderr.
          node packages/tokens/scripts/transform.mjs 2>&1 | tee transform-report.txt

      - name: Open a token PR
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain packages/tokens/tokens/color)" ]; then
            echo "No token changes — Figma matches canonical. No PR opened."
            exit 0
          fi

          branch="figma-sync/tokens-${{ github.run_number }}"
          git config user.name 'cleo-token-sync[bot]'
          git config user.email 'engineering@meetcleo.com'
          git checkout -b "$branch"
          git add packages/tokens/tokens/color
          git commit -m "Sync colour tokens from Figma (run ${{ github.run_number }})"
          git push origin "$branch"

          gh label create figma-sync --color 0E8A16 --description 'Automated Figma token sync' --force

          {
            echo 'Generated by the Cleo Token Sync Figma plugin. Review the colour changes below,'
            echo 'then merge — publishing is COREEXP-334.'
            echo
            echo '<details><summary>Transform report</summary>'
            echo
            echo '```'
            cat transform-report.txt
            echo '```'
            echo
            echo '</details>'
          } > pr-body.md

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Figma token sync (run ${{ github.run_number }})" \
            --label figma-sync \
            --body-file pr-body.md

      - name: Delete the throwaway branch
        if: always()
        run: git push origin --delete "$RAW_BRANCH" || true
