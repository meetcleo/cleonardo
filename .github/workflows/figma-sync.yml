name: figma-sync

# Second half of the Figma → cleonardo pipeline (COREEXP-323).
#
# The Cleo Token Sync Figma plugin pushes a verbatim Figma variable dump to a throwaway
# `figma-sync/raw-<n>` branch under `.figma-sync/`. This workflow runs the transform against
# `main` and opens a review PR containing only the generated outputs.
#
# The dump is copied into `packages/tokens/figma-exports/`, which is gitignored, so it can
# never reach the PR — only `tokens/color/**` and `src/generated/**` do.

on:
  push:
    branches:
      - 'figma-sync/raw-*'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  transform:
    runs-on: ubuntu-latest
    env:
      RAW_BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '18.18.0'

      - name: Copy the Figma dump into the gitignored input directory
        run: |
          set -euo pipefail
          # Explicit refspec: `git fetch origin <branch>` only reliably updates FETCH_HEAD,
          # and the copy below reads origin/<branch>.
          git fetch origin "+refs/heads/$RAW_BRANCH:refs/remotes/origin/$RAW_BRANCH"
          mkdir -p packages/tokens/figma-exports
          git show "origin/$RAW_BRANCH:.figma-sync/figma-dump.json" \
            > packages/tokens/figma-exports/figma-dump.json

      - name: Run the transform
        id: transform
        run: |
          set -euo pipefail
          # transform.mjs logs the change report and every failure to stderr.
          node packages/tokens/scripts/transform.mjs 2>&1 | tee transform-report.txt

      - name: Open a token PR
        run: |
          set -euo pipefail
          # tokenKeys.ts is generated alongside the tokens; both have to move together or the
          # key unions drift from the values they describe.
          outputs="packages/tokens/tokens/color packages/tokens/src/generated"
          if [ -z "$(git status --porcelain $outputs)" ]; then
            echo "No token changes — Figma matches canonical. No PR opened."
            exit 0
          fi

          branch="figma-sync/tokens-${{ github.run_number }}"
          git config user.name 'cleo-token-sync[bot]'
          git config user.email 'engineering@meetcleo.com'
          git checkout -b "$branch"
          git add $outputs
          git commit -m "Sync colour tokens from Figma (run ${{ github.run_number }})"
          git push origin "$branch"

          gh label create figma-sync --color 0E8A16 --description 'Automated Figma token sync' --force

          {
            echo 'Generated by the Cleo Token Sync Figma plugin. Review the colour changes below,'
            echo 'then merge — publishing is COREEXP-334.'
            echo
            echo '<details><summary>Transform report</summary>'
            echo
            echo '```'
            cat transform-report.txt
            echo '```'
            echo
            echo '</details>'
          } > pr-body.md

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Figma token sync (run ${{ github.run_number }})" \
            --label figma-sync \
            --body-file pr-body.md

      - name: Delete the throwaway branch
        if: always()
        run: git push origin --delete "$RAW_BRANCH" || true
