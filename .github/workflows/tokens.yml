name: tokens

# PR checks for the design-tokens package (COREEXP-322). `figma-sync.yml` (COREEXP-323) is the
# only other place that writes to `packages/tokens/tokens/color/**` and `src/generated/**`, but
# GitHub does not fire `pull_request` events for PRs opened with `GITHUB_TOKEN` — so this workflow
# never sees a figma-sync PR. Those get the same checks (minus layer 1, which doesn't apply — the
# transform just wrote the files) run inline inside figma-sync.yml, before the PR is opened.
#
# Layer 1 (this file) — generated files are generated. tokens/color/** and src/generated/** must
# be byte-identical to the merge base unless the PR carries the `token-regen` label. Catches a
# hand-edit anywhere in the generated tree, including the 13 primitives nothing references (a
# $ref-based check can't reach those) and the allowlisted gap.
#
# Layer 2 (tokens:verify) — invariants on the committed tree, every run. Catches a bad value on a
# referenced token or a bad Figma export; it's what runs inside figma-sync.yml too.
#
# See packages/tokens/README.md -> "CI" for the full picture.

on:
  pull_request:
    # labeled/unlabeled are load-bearing: the default types are opened/synchronize/reopened, so
    # applying `token-regen` would not re-trigger, and a manual re-run replays the original
    # payload — the label would stay invisible and the PR stuck red until someone pushed a commit.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'packages/tokens/**'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig.json'
      - '.github/workflows/tokens.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Layer 1 needs the merge base, not just the tip.
          fetch-depth: 0
          # Without this, checkout lands on the synthetic refs/pull/N/merge commit, so HEAD isn't
          # the PR head and the layer 1 diff compares the wrong pair. Unset on push, where the
          # default (the pushed commit) is already correct.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20.10.0'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Generated files are untouched
        if: |
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'token-regen')
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Don't rely on checkout's fetch-depth: 0 having named this remote-tracking ref — name
          # it explicitly, so a missing merge base fails loudly here rather than as a bare exit
          # code from git merge-base.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          base=$(git merge-base "origin/$BASE_REF" HEAD) || {
            echo "Could not compute the merge base against origin/$BASE_REF — layer 1 cannot run."
            exit 1
          }
          if ! git diff --exit-code "$base" HEAD -- packages/tokens/tokens/color packages/tokens/src/generated; then
            echo
            echo "packages/tokens/tokens/color/** and packages/tokens/src/generated/** are generated by"
            echo "\`yarn tokens:transform\` from a Figma dump — see packages/tokens/README.md -> \"Updating from Figma\"."
            echo "If this PR intentionally regenerates them, apply the \`token-regen\` label and re-run."
            exit 1
          fi

      - run: yarn tokens:verify

      - run: yarn tokens:test

      - run: yarn tokens:typecheck
