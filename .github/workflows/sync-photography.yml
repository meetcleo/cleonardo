name: sync-photography

# Publishes committed photography crops after they are merged to main. Generation remains a
# developer-controlled step; this workflow only mirrors the reviewed generated assets to the CDN.
on:
  push:
    branches: [main]
    paths:
      - 'packages/photography/assets/generated/**'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          role-to-assume: ${{ vars.ROLE_ARN }}
          role-external-id: ${{ vars.EXTERNAL_ID }}
          role-session-name: photography-${{ github.run_id }}
          role-skip-session-tagging: true
          role-duration-seconds: 3600

      - name: Sync photography crops to S3
        run: aws s3 sync packages/photography/assets/generated/ s3://cleoassets/mobile_app/photography/
