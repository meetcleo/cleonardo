name: tokens-release

# Publishes the token packages on every merge to main that ships a change (COREEXP-334). One
# trigger, one version bump, one set of release notes, shared across both artefacts:
#
# * npm — `@meetcleo/design-tokens`, published to GitHub Packages. Needs `packages: write`
#   (COREEXP-325) — a 401/403 on the publish step below means that permission isn't in place.
# * RubyGems — `cleo_design_tokens`, published to GitHub Packages' RubyGems registry. The gem is
#   built after the shared version is written, then pushed with this repository's `GITHUB_TOKEN`.
#   Consumers configure Dependabot with a `rubygems-server` registry and a `read:packages` token;
#   see packages/tokens/README.md.
#
# Versioning: the release's version comes from the previous `tokens-v*` tag, not from
# `packages/tokens/package.json`'s committed value — see plan-release.mjs and
# packages/tokens/README.md ("Versioning") for why. The version bump is committed locally so the
# published npm tarball's package.json and the gemspec's version.rb read (see COREEXP-264) both
# carry the real release version, but that commit is never pushed to main — main's ruleset
# (`main-branch-protection`) requires a PR and a review with no bypass actors, so a direct push
# would fail the "no manual steps" acceptance criterion outright. Only the tag is pushed; tags
# aren't covered by that ruleset (`conditions.ref_name` targets the branch only).

on:
  push:
    branches: [main]
    # What ships in the gemspec's spec.files or the npm package's files — not README.md, even
    # though it's in the npm files list too: a docs-only edit doesn't warrant cutting a release.
    paths:
      - 'packages/tokens/tokens/color/**'
      - 'packages/tokens/lib/**'
      - 'packages/tokens/src/**'
      - 'packages/tokens/package.json'
      - 'packages/tokens/cleo_design_tokens.gemspec'

# Serialised, not cancelled: two releases landing back-to-back must not compute the same "next
# version" from a stale view of the previous tag.
concurrency:
  group: tokens-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24.10.0'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Find the previous release
        id: prev
        run: |
          set -euo pipefail
          # Explicit, not relied on from checkout's fetch-depth: 0 — same reasoning tokens.yml
          # gives for naming its base-branch fetch: a missing tag should fail loudly here, not as
          # a bare exit code from a lookup below.
          git fetch --tags --force origin
          # A version sort over the tag list, NOT `git describe --tags` — describe only finds a
          # tag that's an ancestor of HEAD, and the release commit a tag points at (see "Tag the
          # release" below) is deliberately never merged back into main. One release later,
          # describe would find nothing even though the previous tag exists.
          tag=$(git tag --list 'tokens-v*' --sort=-version:refname | head -n1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Plan this release
        id: plan
        run: |
          set -euo pipefail
          prev="${{ steps.prev.outputs.tag }}"
          if [ -n "$prev" ]; then
            node packages/tokens/scripts/plan-release.mjs --previous-tag "$prev" >> "$GITHUB_OUTPUT"
          else
            node packages/tokens/scripts/plan-release.mjs >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if already released
        id: guard
        run: |
          set -euo pipefail
          # A re-run of this exact push (a manual workflow re-run, or a retry after a step below
          # failed) recomputes the same version from the same previous tag — this is what stops
          # that from re-attempting a publish that already succeeded.
          tag="${{ steps.plan.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Already released $tag — nothing to do."
            echo "already-released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the release version
        if: steps.guard.outputs.already-released == 'false'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = "packages/tokens/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Build the npm package
        if: steps.guard.outputs.already-released == 'false'
        run: yarn tokens:build

      - uses: ruby/setup-ruby@v1
        if: steps.guard.outputs.already-released == 'false'
        with:
          ruby-version: '3.2.0'

      - name: Publish the npm package to GitHub Packages
        if: steps.guard.outputs.already-released == 'false'
        working-directory: packages/tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
            echo "@meetcleo:registry=https://npm.pkg.github.com"
          } > .npmrc
          npm publish --registry=https://npm.pkg.github.com
          rm .npmrc

      - name: Publish the Ruby gem to GitHub Packages
        if: steps.guard.outputs.already-released == 'false'
        working-directory: packages/tokens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gem
          chmod 700 ~/.gem
          trap 'rm -f ~/.gem/credentials' EXIT
          printf '%s\n' '---' ":github: Bearer $GITHUB_TOKEN" > ~/.gem/credentials
          chmod 600 ~/.gem/credentials
          gem build cleo_design_tokens.gemspec
          gem push --key github \
            --host https://rubygems.pkg.github.com/meetcleo \
            "cleo_design_tokens-$VERSION.gem"

      - name: Tag the release
        if: steps.guard.outputs.already-released == 'false'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'cleo-token-release[bot]'
          git config user.email 'engineering@meetcleo.com'
          # Only the version bump, not -a: the working tree also holds this job's build output
          # (packages/tokens/dist/, gitignored, but no need to depend on that) and the auth-bearing
          # .npmrc from the previous step, already removed but not worth trusting blindly here.
          # On the first release VERSION is the already-committed value (see plan-release.mjs),
          # so "Write the release version" was a no-op and there's nothing to commit — `git commit`
          # would fail on that empty pathspec, so only commit when the write actually changed
          # something. Local commit only either way, matching main's paragraph above — never
          # pushed as a branch.
          if ! git diff --quiet -- packages/tokens/package.json; then
            git commit -m "Release tokens $VERSION" packages/tokens/package.json
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish the GitHub Release
        if: steps.guard.outputs.already-released == 'false'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "tokens v$VERSION" --notes-file release-notes.md
